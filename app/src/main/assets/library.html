<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ライブTV / 動画</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/android.css"><style>main{padding:20px 32px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}button,.back{padding:12px 18px;color:#f3df9b;background:#211b10;border:1px solid #d6b15a;border-radius:6px;text-decoration:none}.channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.channel{min-height:90px;text-align:left;font-size:17px}h1{font-size:22px}p{color:#b9a575;line-height:1.7}header{align-items:center}.note{font-size:13px}</style></head><body><header><a class="back" href="index.html">← ホーム</a><h1>ライブTV / 動画</h1></header><main><div class="toolbar"><button onclick="tvAction('pickVideo')">端末の動画を開く</button><button onclick="tvAction('pickPlaylist')">M3Uを読み込む</button><button onclick="tvAction('enterUrl')">URLで再生</button><button onclick="if(confirm('元のチャンネル一覧に戻しますか？'))tvAction('resetChannels')">一覧を戻す</button></div><p class="note">VLCなどの再生アプリで開きます。ファイル選択に対応しない端末では「URLで再生」を使用できます。</p><p id="count"></p><div id="channels" class="channels"></div></main><script src="data/library_data.js"></script><script>
(function(){
  var list=window.TV_CHANNELS||[];
  try { if(window.Android&&typeof Android.channels==='function') {var saved=Android.channels();if(saved){var parsed=JSON.parse(saved);if(Array.isArray(parsed))list=parsed;}} } catch(e){console.log(e);}
  var box=document.getElementById('channels');
  document.getElementById('count').textContent=list.length+'チャンネル';
  if(!list.length){document.getElementById('count').textContent='チャンネルが見つかりません。M3Uファイルを読み込んでください。';}
  list.forEach(function(c){var b=document.createElement('button');b.className='channel';b.textContent=c.name||'名称なし';b.onclick=function(){if(window.Android&&Android.playMedia){Android.playMedia(c.source);}else{alert('この画面での再生には専用Android APKが必要です。');}};box.appendChild(b);});
  window.tvAction=function(name){if(window.Android&&typeof Android[name]==='function'){Android[name]();}else{alert('この機能を使うにはPRIVATE SUITEのAndroid APKが必要です。');}};
  var buttons=Array.prototype.slice.call(document.querySelectorAll('a,button'));
  var firstChannel=box.querySelector('button');
  if(firstChannel){firstChannel.setAttribute('tabindex','0');setTimeout(function(){firstChannel.focus();},150);}
  document.addEventListener('keydown',function(e){var idx=buttons.indexOf(document.activeElement);if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();buttons[Math.min(idx+1,buttons.length-1)].focus();}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();buttons[Math.max(idx-1,0)].focus();}else if(e.key==='Escape'||e.key==='Backspace'){window.location.href='index.html';}});
})();
</script><script src="js/android.js"></script></body></html>
