<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ライブTV / 動画</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/android.css"><style>
main{padding:20px 32px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}button,.back{padding:12px 18px;color:#f3df9b;background:#211b10;border:1px solid #d6b15a;border-radius:6px;text-decoration:none}.channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.channel{min-height:90px;text-align:left;font-size:17px}.channel span,.channel small{display:block}.channel small{font-size:14px;color:#b9a575;line-height:1.5;margin-top:6px}h1{font-size:22px}p{color:#b9a575;line-height:1.7}header{align-items:center}.note{font-size:13px}#channelFilters button[aria-pressed=true]{background:#493917;border-color:#f3df9b}
</style></head><body><header><a class="back" href="index.html">ホーム</a><h1>ライブTV / 動画</h1></header><main>
<div class="toolbar"><button onclick="tvAction('pickVideo')">端末の動画を開く</button><button onclick="tvAction('pickPlaylist')">M3Uを読み込む</button><button onclick="tvAction('enterUrl')">URLで再生</button><button onclick="if(confirm('元のチャンネル一覧に戻しますか？'))tvAction('resetChannels')">一覧を戻す</button></div>
<p class="note">VLCなどの再生アプリで開きます。ファイル選択に対応しない端末では「URLで再生」を使用できます。</p>
<div id="channelFilters" class="toolbar" aria-label="チャンネル分類"></div><p id="count" role="status" aria-live="polite"></p><div id="channels" class="channels"></div></main>
<script src="data/library_data.js"></script><script>
(function(){
  var list=window.TV_CHANNELS||[],builtInBySource={};
  list.forEach(function(c){builtInBySource[c.source]=c;});
  try {
    if(window.Android&&typeof Android.channels==='function') {
      var saved=Android.channels();
      if(saved){var parsed=JSON.parse(saved);if(Array.isArray(parsed))list=parsed.map(function(c){
        var defaults=builtInBySource[c.source];if(!defaults)return c;
        var copy={};Object.keys(c).forEach(function(k){copy[k]=c[k];});
        ['group','logo','checkLabel'].forEach(function(k){if(!copy[k]&&defaults[k])copy[k]=defaults[k];});
        return copy;
      });}
    }
  } catch(e){console.log(e);}
  var box=document.getElementById('channels'),filters=document.getElementById('channelFilters'),category='すべて',groups=['すべて'];
  list.forEach(function(c){var group=c.group||'その他';if(groups.indexOf(group)<0)groups.push(group);});
  function render(){
    while(box.firstChild)box.removeChild(box.firstChild);
    var visible=list.filter(function(c){return category==='すべて'||(c.group||'その他')===category;});
    document.getElementById('count').textContent=list.length?visible.length+' / '+list.length+' チャンネル':'チャンネルが見つかりません。M3Uファイルを読み込んでください。';
    visible.forEach(function(c){
      var b=document.createElement('button');b.className='channel';b.setAttribute('type','button');
      var name=document.createElement('span');name.textContent=c.name||'名称なし';b.appendChild(name);
      if(c.checkLabel){var note=document.createElement('small');note.textContent=c.checkLabel;b.appendChild(note);}
      b.onclick=function(){if(window.Android&&Android.playMedia){Android.playMedia(c.source);}else{alert('この画面での再生には専用Android APKが必要です。');}};
      box.appendChild(b);
    });
    Array.prototype.forEach.call(filters.children,function(b){b.setAttribute('aria-pressed',String(b._category===category));});
  }
  groups.forEach(function(group){
    var b=document.createElement('button');b.setAttribute('type','button');b._category=group;
    var count=group==='すべて'?list.length:list.filter(function(c){return(c.group||'その他')===group;}).length;
    b.textContent=(group==='Tokyo'?'地上波':group)+' '+count;
    b.onclick=function(){category=group;render();b.focus();};filters.appendChild(b);
  });
  render();
  window.tvAction=function(name){if(window.Android&&typeof Android[name]==='function'){Android[name]();}else{alert('この機能を使うにはPRIVATE SUITEのAndroid APKが必要です。');}};
  var firstChannel=box.querySelector('button');
  if(firstChannel){firstChannel.setAttribute('tabindex','0');setTimeout(function(){firstChannel.focus();},150);}
  document.addEventListener('keydown',function(e){if(e.key==='Escape'||e.key==='Backspace')window.location.href='index.html';});
})();
</script><script src="js/android.js"></script></body></html>
